# Render Blueprint: deploys the backend (Docker, includes FFmpeg). Frontend goes to Vercel.
services:
  - type: web
    name: clipflow-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://clipflow.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FACEBOOK_ACCESS_TOKEN
        sync: false
